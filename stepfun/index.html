<!doctype html><html lang="zh"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pocket Seek · 本地知识库</title><style>body{font-family:system-ui;background:#f3f6fa;color:#172b42;max-width:1050px;margin:40px auto;padding:20px}section{background:white;padding:24px;border-radius:16px;margin:20px 0}button,input,select,textarea{font:inherit;padding:10px;border:1px solid #bac9d7;border-radius:8px;margin:5px}button{background:#185ed2;color:white;cursor:pointer}button:disabled{opacity:.5}textarea{width:90%;height:100px}#results article{border-top:1px solid #ddd;padding:16px;white-space:pre-wrap}pre{white-space:pre-wrap}small{color:#52667b}</style><h1>Pocket Seek <small>口袋知识库</small></h1><p>向量在你的浏览器生成，原文与向量保存在本机 seekdb。推荐英文语料；模型不擅长中文。</p><section><h2>1 · 本地模型</h2><select id="dtype"><option value="q8">INT8 量化</option><option value="fp32">FP32 对照</option></select><label><input id="wasm" type="checkbox">强制 WASM（验证降级）</label><button id="load">加载模型</button><p id="backend">尚未加载</p><small>首次下载模型需访问 Hugging Face；推理不调用云端 API。切换精度请使用不同知识库。</small></section><section><h2>2 · 增量导入</h2><label>知识库 <input id="kb" value="demo" pattern="[a-z0-9_]+"></label><label>批大小<select id="batch"><option>8</option><option>1</option><option>16</option></select></label><input id="files" type="file" multiple accept=".txt,.md"><textarea id="text" placeholder="也可以直接粘贴文本"></textarea><button id="import">导入并刷新索引</button><button id="bench">运行固定评测</button><p>同名知识库可连续导入；精度自动加入集合标识，避免 FP32 与 INT8 混写。</p></section><section><h2>3 · 混合检索</h2><input id="query" placeholder="How to grow tomatoes?" size="45"><button id="search">检索</button><div id="results"></div></section><section><h2>运行记录</h2><p id="status">就绪</p><button id="export">导出实测 JSON</button><pre id="metrics"></pre></section><script type="module" src="/main.js"></script></html>
